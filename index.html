    <meta property="og:description" content="Complete transport management system with 4-copy Lorry Receipt generation, master registries, payment tracking, customer ledgers, and operational reports." />

    <script>
      // Prevent Vite HMR WebSocket from throwing "WebSocket closed without opened" in Cloud Run / proxy environment
      (function () {
        var NativeWebSocket = window.WebSocket;
        if (NativeWebSocket) {
          var PatchedWebSocket = function (url, protocols) {
            var isViteHmr =
              protocols === 'vite-hmr' ||
              (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
              (typeof url === 'string' && url.indexOf('token=') !== -1);
            if (isViteHmr) {
              return {
                readyState: 1,
                send: function () {},
                close: function () {},
                addEventListener: function () {},
                removeEventListener: function () {},
                dispatchEvent: function () { return true; }
              };
            }
            return protocols !== undefined
              ? new NativeWebSocket(url, protocols)
              : new NativeWebSocket(url);
          };
          PatchedWebSocket.prototype = NativeWebSocket.prototype;
          PatchedWebSocket.CONNECTING = NativeWebSocket.CONNECTING;
          PatchedWebSocket.OPEN = NativeWebSocket.OPEN;
          PatchedWebSocket.CLOSING = NativeWebSocket.CLOSING;
          PatchedWebSocket.CLOSED = NativeWebSocket.CLOSED;
          window.WebSocket = PatchedWebSocket;
        }
      })();

      window.addEventListener('error', function (event) {
        if (event && (
          (event.message && (event.message.includes('WebSocket') || event.message.includes('@vite/client'))) ||
          (event.filename && event.filename.includes('@vite/client'))
        )) {
          event.stopImmediatePropagation();
          event.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function (event) {
        if (event && event.reason && (
          (typeof event.reason.message === 'string' && event.reason.message.includes('WebSocket')) ||
          (typeof event.reason.stack === 'string' && event.reason.stack.includes('@vite/client'))
        )) {
          event.stopImmediatePropagation();
          event.preventDefault();
        }
      }, true);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
